# 引导部署：Fork 后运行本工作流即可完成首次部署。
#
# 两种模式（自动选择）：
# - 已配置 GitHub secret CLOUDFLARE_API_TOKEN → 无 UI 引导：直接建资源、部署、回写配置，
#   汇总（面板地址、回调地址、ADMIN_TOKEN、后续步骤）写进本页 Summary。
# - 未配置 → 网页引导：工作流起一个 Cloudflare Quick Tunnel 暴露向导网页，
#   点开 run 页 Summary 里的链接，跟着网页一步步做（创建 token、填表、看进度）。
#
# 幂等可重跑：资源按名字复用、配置已是目标值则不产生提交。
# 权限需求：contents: write 用于把回写的 wrangler.jsonc 提交进你的 fork。

name: Bootstrap

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Cloudflare 账户 ID（单账户可留空自动推导）'
        required: false
        default: ''
      worker_name:
        description: 'Worker / KV / D1 名称（默认 qqbot）'
        required: false
        default: 'qqbot'
      kv_name:
        description: 'KV 名称（留空=同 Worker 名；none=跳过 KV）'
        required: false
        default: ''
      d1_name:
        description: 'D1 名称（留空=同 Worker 名；none=跳过 D1）'
        required: false
        default: ''
      r2_name:
        description: 'R2 桶名（留空=<Worker名>-artifacts；none=跳过 R2）'
        required: false
        default: ''
      custom_domain:
        description: '自定义域名（可选；大陆访问 *.workers.dev 不稳定时建议填）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # wrangler 要求 Node 22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 无 UI 引导
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BUILDS_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ github.event.inputs.account_id }}
          BOOT_WORKER_NAME: ${{ github.event.inputs.worker_name }}
          BOOT_KV_NAME: ${{ github.event.inputs.kv_name }}
          BOOT_D1_NAME: ${{ github.event.inputs.d1_name }}
          BOOT_R2_NAME: ${{ github.event.inputs.r2_name }}
          BOOT_DOMAIN: ${{ github.event.inputs.custom_domain }}
          # QQ 凭证只能走 secret：dispatch 输入会显示在 run 页面
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
        run: node scripts/bootstrap/headless.mjs

      - name: 网页引导（Quick Tunnel 向导）
        if: env.HAS_TOKEN != 'true'
        env:
          BOOT_ACCOUNT_ID: ${{ github.event.inputs.account_id }}
          BOOT_WORKER_NAME: ${{ github.event.inputs.worker_name }}
          BOOT_KV_NAME: ${{ github.event.inputs.kv_name }}
          BOOT_D1_NAME: ${{ github.event.inputs.d1_name }}
          BOOT_R2_NAME: ${{ github.event.inputs.r2_name }}
          BOOT_DOMAIN: ${{ github.event.inputs.custom_domain }}
          REPO: ${{ github.repository }}
        run: node scripts/bootstrap/wizard.mjs
