# 引导部署：Fork 后运行本工作流即可完成首次部署。
#
# 两种模式（自动选择）：
# - 已配置 GitHub secret CLOUDFLARE_API_TOKEN → 无 UI 引导：直接建资源、部署，
#   后续步骤（绑自定义域名、创建机器人并填回调、连接仓库）写进本页 Summary。
# - 未配置 → 网页引导：工作流起一个 Cloudflare Quick Tunnel 暴露向导网页，
#   向导网址打在这一步的实时日志里（Summary 要等这一步结束才显示），
#   打开后跟着网页一步步做（创建 token、填表、看进度）。
#
# 公开仓库的日志与 Summary 谁都能看：账户 ID、workers.dev 地址、资源 id 在日志里打码，
# Summary 里不写；面板地址只在网页向导的完成页显示，无 UI 模式到 Cloudflare 后台看。
# QQ 机器人不在引导里建，部署完到面板「设置」里扫码创建或填入凭证。
#
# 幂等可重跑：资源按名字复用，零 Git 污染（不产生任何提交，上游同步保持零冲突）。

name: Bootstrap

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Cloudflare 账户 ID（单账户留空自动推导；填了会公开显示在运行页，不想公开就改配 Secret CLOUDFLARE_ACCOUNT_ID）'
        required: false
        default: ''
      worker_name:
        description: 'Worker / KV / D1 名称（默认 qqbot）'
        required: false
        default: 'qqbot'
      kv_name:
        description: 'KV 名称（留空=同 Worker 名）'
        required: false
        default: ''
      d1_name:
        description: 'D1 名称（留空=同 Worker 名；none=跳过 D1）'
        required: false
        default: ''
      r2_name:
        description: 'R2 桶名（留空=<Worker名>-artifacts；none=跳过 R2）'
        required: false
        default: ''

permissions:
  contents: read

# 部署类工作流必须排队而不是取消：中途杀掉引导会留下半配置状态
# （比如 Worker 已部署但密钥未写入）。脚本本身幂等，排队重跑是安全的。
concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # 必须大于向导自己的超时组合（15min 等待认领 + 40min 空闲 + 完成后 10min 查看窗口 = 65min），
    # 否则慢一点的操作会被 runner 硬杀在半配置状态
    timeout-minutes: 75
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # wrangler 要求 Node 22
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 无 UI 引导
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BUILDS_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_TOKEN }}
          # 可选：构建机拉清单用的专用令牌（Worker 侧 BUILD_TOKEN = 构建机侧 MANIFEST_TOKEN）。
          # 不配时首次自动生成，重跑沿用 Worker 上已有的值；配了则以它为准（想轮换时用）。
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
          # dispatch 输入会公开显示在运行页，不想公开账户 ID 就配同名 secret
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id || secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOT_WORKER_NAME: ${{ inputs.worker_name }}
          BOOT_KV_NAME: ${{ inputs.kv_name }}
          BOOT_D1_NAME: ${{ inputs.d1_name }}
          BOOT_R2_NAME: ${{ inputs.r2_name }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/bootstrap/headless.mjs

      - name: 网页引导（Quick Tunnel 向导）
        if: env.HAS_TOKEN != 'true'
        env:
          BOOT_ACCOUNT_ID: ${{ inputs.account_id || secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOT_WORKER_NAME: ${{ inputs.worker_name }}
          BOOT_KV_NAME: ${{ inputs.kv_name }}
          BOOT_D1_NAME: ${{ inputs.d1_name }}
          BOOT_R2_NAME: ${{ inputs.r2_name }}
          REPO: ${{ github.repository }}
        run: node scripts/bootstrap/wizard.mjs
