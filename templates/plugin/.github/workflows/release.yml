name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 tag 与 package.json 的 version 一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG 与 package.json version $PKG 不一致" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test

      # 开了 Immutable Releases 后，已发布的 release 不能再传资产（422），
      # 所以先建草稿把产物附齐，再整体发布
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/plugin.js
            dist/manifest.json

      - name: 发布草稿
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
