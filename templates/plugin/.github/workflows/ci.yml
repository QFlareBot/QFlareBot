name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # @qqbot 是框架占位 scope：发布到 npm 之前，模板 CI 装不了依赖。
      # 已把 scope 换成自己的仓库（package.json 里不再有 @qqbot/）会自动跳过本检查。
      - name: 预检 @qqbot 依赖是否已发布
        run: |
          if grep -q '"@qqbot/' package.json && ! npm view @qqbot/sdk version >/dev/null 2>&1; then
            echo "::error::@qqbot/sdk 尚未发布到 npm，模板 CI 无法安装依赖。可选做法："
            echo "  1. 把依赖 scope 换成你自己的并发布（见框架根 README 的占位 scope 说明）；"
            echo "  2. 回到框架 monorepo 内以 workspace 方式开发本插件；"
            echo "  3. npm link 本地调试，依赖可用后再启用本工作流。"
            exit 1
          fi

      # tag 必须与 package.json 的 version 一致
      - name: 校验 tag 与 version 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG 与 package.json version $PKG 不一致" >&2
            exit 1
          fi

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - run: npm run typecheck

      - name: 构建并校验声明清单与源码一致
        run: |
          npm run build
          node -e "
            const fs = require('node:fs');
            const built = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
            const declared = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const stable = (v) => {
              if (v === null || typeof v !== 'object') return JSON.stringify(v);
              if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
              return '{' + Object.keys(v).sort().map((k) => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
            };
            if (stable(built) !== stable(declared)) {
              console.error('manifest.json（声明清单）与 dist/manifest.json 不一致：');
              console.error('请运行 npm run sync 后提交新的 manifest.json');
              process.exit(1);
            }
          "

      - run: npm test
